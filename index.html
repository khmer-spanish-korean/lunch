<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>시엠립 오늘 뭐 먹지? (점심 추천기)</title>
  <!-- 모바일 친화적 Tailwind CSS 불러오기 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 구글 폰트 (Pretendard 스타일 대용 Noto Sans) -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans KR', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 pb-12">

  <!-- 헤더 -->
  <header class="bg-amber-500 text-white p-5 sticky top-0 shadow-md z-30">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div>
        <h1 class="text-xl font-bold flex items-center gap-2">
          🇰🇭 시엠립 점심 추천기
        </h1>
        <p class="text-xs text-amber-100">오늘 점심 실패 없는 한 끼 고르기</p>
      </div>
      <span class="text-2xl">🍜</span>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4">

    <!-- 필터 설정 카드 -->
    <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-4">
      
      <!-- 음식 종류 선택 -->
      <div>
        <label class="block text-xs font-bold text-slate-500 mb-2">음식 종류</label>
        <div class="grid grid-cols-4 gap-2 text-sm">
          <button onclick="setCuisine('all')" id="btn-c-all" class="cuisine-btn py-2 rounded-xl border border-amber-500 bg-amber-500 text-white font-medium text-center">전체</button>
          <button onclick="setCuisine('korean')" id="btn-c-korean" class="cuisine-btn py-2 rounded-xl border border-slate-200 bg-slate-50 text-slate-700 font-medium text-center">한식</button>
          <button onclick="setCuisine('khmer')" id="btn-c-khmer" class="cuisine-btn py-2 rounded-xl border border-slate-200 bg-slate-50 text-slate-700 font-medium text-center">크메르</button>
          <button onclick="setCuisine('western')" id="btn-c-western" class="cuisine-btn py-2 rounded-xl border border-slate-200 bg-slate-50 text-slate-700 font-medium text-center">양식/카페</button>
        </div>
      </div>

      <!-- 예산/가격대 선택 -->
      <div>
        <label class="block text-xs font-bold text-slate-500 mb-2">1인당 예산</label>
        <div class="grid grid-cols-4 gap-2 text-sm">
          <button onclick="setPrice('all')" id="btn-p-all" class="price-btn py-1.5 rounded-lg border border-amber-500 bg-amber-500 text-white text-xs font-medium">전체</button>
          <button onclick="setPrice('1')" id="btn-p-1" class="price-btn py-1.5 rounded-lg border border-slate-200 bg-slate-50 text-slate-700 text-xs font-medium">$ (~3$)</button> <button onclick="setPrice('2')" id="btn-p-2" class="price-btn py-1.5 rounded-lg border border-slate-200 bg-slate-50 text-slate-700 text-xs font-medium">$$ (4~8$)</button> <button onclick="setPrice('3')" id="btn-p-3" class="price-btn py-1.5 rounded-lg border border-slate-200 bg-slate-50 text-slate-700 text-xs font-medium">$$$(9$+)</button>
        </div>
      </div>

      <!-- 시엠립 특화: 에어컨 필터 -->
      <div class="flex items-center justify-between pt-1 border-t border-slate-100">
        <span class="text-xs font-semibold text-slate-600 flex items-center gap-1">
          ❄️ 에어컨 있는 식당만 보기
        </span>
        <label class="relative inline-flex items-center cursor-pointer">
          <input type="checkbox" id="acFilter" class="sr-only peer" onchange="applyFilters()">
          <div class="w-9 h-5 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-amber-500"></div>
        </label>
      </div>

      <!-- 액션 버튼 -->
      <div class="pt-2 flex gap-2">
        <button onclick="pickRandom()" class="flex-1 bg-amber-500 hover:bg-amber-600 text-white font-bold py-3 rounded-xl shadow transition duration-150 flex items-center justify-center gap-2">
          <span>🎲</span> 오늘 점심 랜덤 추천!
        </button>
      </div>

    </div>

    <!-- 결과 카운트 -->
    <div class="flex justify-between items-center px-1 text-xs text-slate-500 font-semibold">
      <span>추천 식당 목록</span>
      <span id="resultCount">0곳 발견</span>
    </div>

    <!-- 식당 카드 리스트 컨테이너 -->
    <div id="restaurantList" class="space-y-3">
      <!-- 자바스크립트로 동적 생성됨 -->
    </div>

  </main>

  <script>
    // 시엠립 인기 점심 식당 샘플 데이터
    const restaurants = [
      {
        id: 1,
        name: "대박식당 (Daebak)",
        cuisine: "korean",
        price: 2,
        hasAC: true,
        area: "살라 캄륵 / 앙코르 하이웨이 부근",
        menu: "김치찌개, 제육쌈밥, 삼겹살",
        rating: 4.5,
        mapUrl: "https://www.google.com/maps/search/?api=1&query=Daebak+Restaurant+Siem+Reap"
      },
      {
        id: 2,
        name: "가야원 (Gaya Won)",
        cuisine: "korean",
        price: 2,
        hasAC: true,
        area: "왓보 로드 주변",
        menu: "갈비탕, 냉면, 한식 정식",
        rating: 4.3,
        mapUrl: "https://www.google.com/maps/search/?api=1&query=Gayawon+Siem+Reap"
      },
      {
        id: 3,
        name: "크메르 그릴 (Khmer Grill)",
        cuisine: "khmer",
        price: 1,
        hasAC: false,
        area: "왓보 (Wat Bo)",
        menu: "비프 록락 (Lok Lak), 바베큐 립",
        rating: 4.6,
        mapUrl: "https://www.google.com/maps/search/?api=1&query=Khmer+Grill+Siem+Reap"
      },
      {
        id: 4,
        name: "크메르 키친 (Khmer Kitchen)",
        cuisine: "khmer",
        price: 2,
        hasAC: false,
        area: "올드 마켓 / 펍스트리트",
        menu: "치킨 아목 (Amok), 모닝글로리 볶음",
        rating: 4.3,
        mapUrl: "https://www.google.com/maps/search/?api=1&query=Khmer+Kitchen+Restaurant+Siem+Reap"
      },
      {
        id: 5,
        name: "찬레이 트리 (Chanrey Tree)",
        cuisine: "khmer",
        price: 3,
        hasAC: true,
        area: "강변 (Riverside)",
        menu: "크메르 파인다이닝 정식, 고급 록락",
        rating: 4.7,
        mapUrl: "https://www.google.com/maps/search/?api=1&query=Chanrey+Tree+Siem+Reap"
      },
      {
        id: 6,
        name: "시스터 스레이 카페 (Sister Srey)",
        cuisine: "western",
        price: 2,
        hasAC: false,
        area: "강변 올드마켓 쪽",
        menu: "에그 베네딕트, 수제 버거, 스무디볼",
        rating: 4.6,
        mapUrl: "https://www.google.com/maps/search/?api=1&query=Sister+Srey+Cafe+Siem+Reap"
      },
      {
        id: 7,
        name: "더 리틀 레드 폭스 (The Little Red Fox)",
        cuisine: "western",
        price: 1,
        hasAC: true,
        area: "왓보 (Kandal Village)",
        menu: "베이글 샌드위치, 콜드브루, 샐러드",
        rating: 4.8,
        mapUrl: "https://www.google.com/maps/search/?api=1&query=The+Little+Red+Fox+Espresso+Siem+Reap"
      },
      {
        id: 8,
        name: "일 포르노 (Il Forno)",
        cuisine: "western",
        price: 3,
        hasAC: true,
        area: "펍스트리트 인근 골목",
        menu: "정통 이탈리안 화덕 피자, 생면 파스타",
        rating: 4.5,
        mapUrl: "https://www.google.com/maps/search/?api=1&query=Il+Forno+Siem+Reap"
      }
    ];

    // 필터 상태값
    let selectedCuisine = 'all';
    let selectedPrice = 'all';

    function setCuisine(type) {
      selectedCuisine = type;
      document.querySelectorAll('.cuisine-btn').forEach(btn => {
        btn.className = "cuisine-btn py-2 rounded-xl border border-slate-200 bg-slate-50 text-slate-700 font-medium text-center";
      });
      document.getElementById('btn-c-' + type).className = "cuisine-btn py-2 rounded-xl border border-amber-500 bg-amber-500 text-white font-medium text-center";
      applyFilters();
    }

    function setPrice(level) {
      selectedPrice = level;
      document.querySelectorAll('.price-btn').forEach(btn => {
        btn.className = "price-btn py-1.5 rounded-lg border border-slate-200 bg-slate-50 text-slate-700 text-xs font-medium";
      });
      document.getElementById('btn-p-' + level).className = "price-btn py-1.5 rounded-lg border border-amber-500 bg-amber-500 text-white text-xs font-medium";
      applyFilters();
    }

    function getFilteredList() {
      const acOnly = document.getElementById('acFilter').checked;
      return restaurants.filter(item => {
        const matchCuisine = selectedCuisine === 'all' || item.cuisine === selectedCuisine;
        const matchPrice = selectedPrice === 'all' || item.price.toString() === selectedPrice;
        const matchAC = !acOnly || item.hasAC;
        return matchCuisine && matchPrice && matchAC;
      });
    }

    function renderList(list, highlightId = null) {
      const container = document.getElementById('restaurantList');
      const countEl = document.getElementById('resultCount');
      container.innerHTML = '';
      countEl.innerText = `${list.length}곳 발견`;

      if (list.length === 0) {
        container.innerHTML = `
          <div class="bg-white p-8 rounded-2xl text-center border border-slate-200 text-slate-400">
            <span class="text-3xl block mb-2">😢</span>
            조건에 맞는 식당이 없습니다.<br>필터를 조금 완화해보세요!
          </div>
        `;
        return;
      }

      list.forEach(r => {
        const isHighlight = highlightId === r.id;
        const priceLabel = "$".repeat(r.price);
        
        const card = document.createElement('div');
        card.className = `bg-white p-4 rounded-2xl border transition-all duration-300 shadow-sm ${
          isHighlight ? 'ring-2 ring-amber-500 border-amber-500 bg-amber-50/30' : 'border-slate-200'
        }`;

        card.innerHTML = `
          <div class="flex justify-between items-start mb-2">
            <div>
              <div class="flex items-center gap-1.5">
                <h3 class="font-bold text-slate-800 text-base">${r.name}</h3>
                ${isHighlight ? '<span class="bg-amber-500 text-white text-[10px] px-1.5 py-0.5 rounded-md font-bold">오늘의 PICK</span>' : ''}
              </div>
              <p class="text-xs text-slate-400 mt-0.5">📍 ${r.area}</p>
            </div>
            <div class="flex items-center text-amber-500 font-bold text-sm bg-amber-50 px-2 py-0.5 rounded-md">
              ★ ${r.rating}
            </div>
          </div>

          <div class="my-2 text-xs bg-slate-50 p-2.5 rounded-xl border border-slate-100 space-y-1">
            <div class="text-slate-600 font-medium">추천 메뉴: <span class="text-slate-800 font-bold">${r.menu}</span></div>
          </div>

          <div class="flex items-center justify-between pt-2">
            <div class="flex gap-1.5 text-[11px]">
              <span class="px-2 py-0.5 bg-slate-100 rounded text-slate-600 font-semibold">${priceLabel}</span>
              ${r.hasAC ? '<span class="px-2 py-0.5 bg-blue-50 text-blue-600 rounded font-semibold">❄️ 에어컨</span>' : '<span class="px-2 py-0.5 bg-slate-100 text-slate-500 rounded">선풍기/야외</span>'}
            </div>
            
            <a href="${r.mapUrl}" target="_blank" class="inline-flex items-center gap-1 text-xs font-bold text-blue-600 bg-blue-50 hover:bg-blue-100 px-3 py-1.5 rounded-lg transition">
              구글맵 보기 ↗
            </a>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function applyFilters() {
      const filtered = getFilteredList();
      renderList(filtered);
    }

    function pickRandom() {
      const filtered = getFilteredList();
      if (filtered.length === 0) {
        alert("선택하신 조건에 맞는 식당이 없습니다!");
        return;
      }
      const randomItem = filtered[Math.floor(Math.random() * filtered.length)];
      // 해당 식당을 가장 맨 위로 올리고 강조 표시
      const reordered = [randomItem, ...filtered.filter(i => i.id !== randomItem.id)];
      renderList(reordered, randomItem.id);
      window.scrollTo({ top: 220, behavior: 'smooth' });
    }

    // 첫 실행 초기화
    applyFilters();
  </script>
</body>
</html>
